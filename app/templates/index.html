<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoseWise Academy | أكاديمية دوز وايز لإدارة التدريب الطبي</title>
  <meta name="description" content="نظام الإدارة الشامل والإنتاجي لأكاديمية دوز وايز للتدريب الطبي والمهني - DoseWise Academy Complete Training Center Management System">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo-icon.svg">

  <!-- Google Fonts: Cairo & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System & Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Fullscreen Login View Container -->
  <div id="loginContainer" style="display: none; min-height: 100vh; align-items: center; justify-content: center; background: radial-gradient(circle at top, #0A192F 0%, #060D1A 100%); padding: 1.5rem;">
    <!-- Rendered dynamically by App.showLoginView() -->
  </div>

  <!-- Main Authenticated App Shell -->
  <div id="appShell" class="app-container" style="display: none;">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="/static/img/logo-white.svg" alt="DoseWise Academy" class="sidebar-brand-logo">
      </div>
      
      <div class="sidebar-content" id="sidebarNav">
        <!-- Injected dynamically by App.renderAppShell() -->
      </div>

      <div class="sidebar-footer">
        <div class="user-avatar-badge" id="sidebarUserAvatar">DW</div>
        <div class="user-info-text">
          <div class="user-info-name" id="sidebarUserName">د. محمد الشناوي</div>
          <div class="user-info-role" id="sidebarUserRole">Super Admin</div>
        </div>
        <button class="btn btn-icon btn-secondary" onclick="App.logout()" title="تسجيل الخروج" style="border-color: rgba(255,255,255,0.15); color: #E2E8F0;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Viewport Area -->
    <div class="main-wrapper">
      
      <!-- Top Sticky Navbar -->
      <header class="top-navbar">
        <div class="navbar-left">
          <button class="menu-toggle-btn" onclick="App.toggleSidebar()" aria-label="Toggle Navigation">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- Global Quick Search Box -->
          <div class="global-search-box">
            <span class="global-search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" id="globalSearchInput" class="global-search-input" 
                   placeholder="بحث شامل... (Ctrl+K)" 
                   onkeydown="if(event.key==='Enter') App.handleGlobalSearch(this.value)">
          </div>
        </div>

        <div class="navbar-right">
          <!-- Clear Dummy Data Button -->
          <button class="btn btn-sm btn-danger" onclick="App.openClearDataModal()" id="clearDataNavBtn" title="حذف وتفريغ كافة البيانات التجريبية" style="font-size: 0.78rem; padding: 0.35rem 0.65rem; display: inline-flex; align-items: center; gap: 0.35rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            <span id="clearDataNavText">تفريغ الدامي داتا</span>
          </button>

          <!-- Notification Bell with Unread Badge -->
          <button class="header-btn" onclick="App.openNotificationsDrawer()" title="التنبيهات والإشعارات" id="notificationBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-dot" id="notificationDot" style="display: none;"></span>
          </button>

          <!-- Theme Dark/Light Toggle -->
          <button class="header-btn" onclick="App.toggleTheme()" title="تبديل الوضع الليلي / النهاري" id="themeToggleBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <!-- Language Switcher (AR / EN) -->
          <button class="lang-switch-btn" onclick="I18N.toggleLang()" id="langSwitchBtn">
            English
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main class="main-content" id="mainContent">
        <!-- Rendered dynamically by current route module -->
      </main>

    </div>
  </div>

  <!-- Global Modal Dialog & Toast Container (Created in DOM by api.js) -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Application Logic Modules -->
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script src="/static/js/students.js"></script>
  <script src="/static/js/courses.js"></script>
  <script src="/static/js/groups.js"></script>
  <script src="/static/js/calendar.js"></script>
  <script src="/static/js/trainers.js"></script>
  <script src="/static/js/attendance.js"></script>
  <script src="/static/js/finance.js"></script>
  <script src="/static/js/expenses.js"></script>
  <script src="/static/js/leads.js"></script>
  <script src="/static/js/assessments.js"></script>
  <script src="/static/js/reports.js"></script>
  <script src="/static/js/users.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
