services:
  - type: web
    name: dosewise-academy
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DOSEWISE_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
